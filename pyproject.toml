[project]
name = "codex-tui"
version = "0.1.0"
description = "A Codex Desktop-like terminal UI backed by the local codex CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-tui = "codex_tui.__main__:main"

# Keep the package index working even when the user's global uv config points
# at an unreachable mirror (e.g. a 403-ing TUNA endpoint).
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
