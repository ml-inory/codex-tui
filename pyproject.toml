[project]
name = "codex-tui"
version = "0.1.0"
description = "A Codex Desktop-like terminal UI backed by the local codex CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=3.0",
]

[project.scripts]
codex-tui = "codex_tui.__main__:main"

# Keep the package index on the Aliyun mirror, matching the user's global uv
# config, so dependency installs stay fast inside China.
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
